dependencies:
  idf: ">=5.3.0"
  lvgl/lvgl: "~8.3.0"
  espressif/esp_lvgl_port: "~1.4.0"
  espressif/esp_lcd_touch_ft5x06: "~1.0.7"
  espressif/esp_codec_dev: "~1.3.0"
  espressif/esp_websocket_client: "^1.2.3"
  # esp32-camera 放在 components/esp32-camera（本地修改版）：
  # 官方 2.1.x 在 IDF 5.3 上强制使用旧版 I2C 驱动，会和本工程的新版
